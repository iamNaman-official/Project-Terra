name: Bug Report to Discord

on:
  issues:
    types: [labeled]

jobs:
  notify-discord:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest

    steps:
      - name: Send bug report to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUG_WEBHOOK }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          BODY=$(printf '%s' "$ISSUE_BODY" | head -c 3900)

          jq -n \
            --arg title "$ISSUE_TITLE" \
            --arg body "$BODY" \
            --arg url "$ISSUE_URL" \
            --arg author "$ISSUE_AUTHOR" \
            '{
              embeds: [{
                title: ("🐛 " + $title),
                url: $url,
                description: $body,
                author: {
                  name: $author
                },
                footer: {
                  text: "TERRA • Bug Report"
                }
              }]
            }' > payload.json

          curl -H "Content-Type: application/json" \
               -X POST \
               --data @payload.json \
               "$DISCORD_WEBHOOK"
